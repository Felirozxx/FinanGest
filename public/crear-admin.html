<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Admin - FinanGest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        
        .info-box p {
            color: #555;
            line-height: 1.6;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }
        
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }
        
        .credentials {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .credentials.show {
            display: block;
        }
        
        .credentials h3 {
            color: #856404;
            margin-bottom: 15px;
        }
        
        .credential-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: white;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        
        .credential-item strong {
            color: #333;
        }
        
        .credential-item span {
            color: #667eea;
            font-weight: bold;
        }
        
        .login-btn {
            margin-top: 15px;
            background: #28a745;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Crear Admin</h1>
        <p class="subtitle">Configuración inicial de FinanGest</p>
        
        <div class="info-box">
            <p><strong>¿Qué hace esto?</strong></p>
            <p>Este botón creará (o actualizará) el usuario administrador de FinanGest con credenciales predeterminadas.</p>
        </div>
        
        <button id="createBtn" onclick="createAdmin()">
            ✨ Crear/Actualizar Admin
        </button>
        
        <div id="result" class="result"></div>
        
        <div id="credentials" class="credentials">
            <h3>✅ Credenciales de Admin</h3>
            <div class="credential-item">
                <strong>Email:</strong>
                <span id="emailValue">admin@finangest.com</span>
            </div>
            <div class="credential-item">
                <strong>Password:</strong>
                <span id="passwordValue">admin123</span>
            </div>
            <button class="login-btn" onclick="goToLogin()">
                🚀 Ir al Login
            </button>
        </div>
    </div>

    <script>
        async function createAdmin() {
            const btn = document.getElementById('createBtn');
            const result = document.getElementById('result');
            const credentials = document.getElementById('credentials');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Creando...';
            result.style.display = 'none';
            credentials.classList.remove('show');
            
            try {
                const response = await fetch('/api/create-admin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        secretKey: 'CREATE_ADMIN_2026_FINANGEST'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    result.className = 'result success';
                    result.textContent = '✅ ' + data.message;
                    result.style.display = 'block';
                    credentials.classList.add('show');
                } else {
                    throw new Error(data.error || 'Error desconocido');
                }
            } catch (error) {
                result.className = 'result error';
                result.textContent = '❌ Error: ' + error.message;
                result.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '✨ Crear/Actualizar Admin';
            }
        }
        
        function goToLogin() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
